<div class="container" style="text-align: center">
  <h2 style="margin: 3%">Reporte de Interacciones por Usuario</h2>

  @if (cargando) {
    <p>Cargando reporte...</p>
  } @else if (sinDatos) {
    <p>No hay interacciones registradas todavía.</p>
  } @else {
    <mat-card class="mat-elevation-z4" style="max-width: 800px; margin: 0 auto; padding: 16px;">
      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      ></canvas>
    </mat-card>

    <div style="margin-top: 24px;">
      <table mat-table [dataSource]="reporte" class="mat-elevation-z8">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Usuario</th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="interacciones">
          <th mat-header-cell *matHeaderCellDef>Interacciones</th>
          <td mat-cell *matCellDef="let element">{{ element.interacciones }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</div>
