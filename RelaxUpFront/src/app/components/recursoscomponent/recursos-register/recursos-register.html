<div class="container">
  <div style="text-align: center; margin: 2%">
    <h2>{{ editMode ? 'Editar Recurso' : 'Registrar Recurso' }}</h2>
  </div>
  <div style="text-align: center; margin: 3%">
    <form [formGroup]="form" (submit)="aceptar()" class="example-form">

      <mat-form-field>
        <mat-label>Titulo</mat-label>
        <input matInput formControlName="Titulo" />
      </mat-form-field>
      <br />

      <mat-form-field>
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="Tipo">
          @for (t of tipos; track t) {
            <mat-option [value]="t">{{ t }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br />

      <mat-form-field>
        <mat-label>Enlace</mat-label>
        <input matInput formControlName="Enlace" placeholder="https://..." />
        @if (form.get('Enlace')?.hasError('pattern')) {
          <mat-error>Debe ser una URL válida (http/https)</mat-error>
        }
      </mat-form-field>
      <br />

      <mat-form-field>
        <mat-label>Usuario</mat-label>
        <mat-select formControlName="IdUsuario">
          @for (u of usuarios; track u.idUsuario) {
            <mat-option [value]="u.idUsuario">{{ u.nombres }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div>
        <button matButton="elevated">{{ editMode ? 'Actualizar' : 'Registrar' }}</button>
      </div>
      <br />
      <div>
        <button matButton="elevated" routerLink="/homes">Cancelar</button>
      </div>
    </form>
  </div>
</div>
