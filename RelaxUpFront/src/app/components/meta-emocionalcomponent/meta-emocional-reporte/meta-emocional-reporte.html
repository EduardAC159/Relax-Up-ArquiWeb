<div class="container" style="text-align: center">
  <h2 style="margin: 3%">Reporte de Metas Emocionales</h2>

  @if (cargando) {
    <p>Cargando reporte...</p>
  } @else {
    <div style="display: flex; justify-content: center; gap: 24px; margin-bottom: 24px;">
      <mat-card class="mat-elevation-z4" style="padding: 16px; min-width: 220px;">
        <p style="margin: 0; font-size: 14px; color: gray;">Usuarios que completaron</p>
        <p style="margin: 0; font-size: 32px; font-weight: bold;">{{ totalCompletaron }}</p>
      </mat-card>

      <mat-card class="mat-elevation-z4" style="padding: 16px; min-width: 220px;">
        <p style="margin: 0; font-size: 14px; color: gray;">Total de usuarios</p>
        <p style="margin: 0; font-size: 32px; font-weight: bold;">{{ totalUsuarios }}</p>
      </mat-card>
    </div>

    <mat-card class="mat-elevation-z4" style="max-width: 400px; margin: 0 auto; padding: 16px;">
      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      ></canvas>
    </mat-card>
  }
</div>
